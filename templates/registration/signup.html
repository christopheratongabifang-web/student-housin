{% extends 'base.html' %}

{% block extra_head %}
<style>
    .django-form input[type="text"],
    .django-form input[type="password"],
    .django-form input[type="email"],
    .django-form select {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
        margin-top: 0.25rem;
        font-family: inherit;
    }
    .django-form input:focus, .django-form select:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 1px #6366f1;
    }
    .django-form label {
        font-size: 0.875rem;
        font-weight: 500;
        color: #374151;
    }
    .django-form .helptext {
        font-size: 0.75rem;
        color: #6b7280;
        display: block;
        margin-top: 0.25rem;
    }
    .django-form ul.errorlist {
        color: #ef4444;
        font-size: 0.875rem;
        list-style: none;
        padding-left: 0;
        margin-top: 0.25rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg border border-gray-100">
        <div>
            <h2 class="mt-2 text-center text-3xl font-extrabold text-gray-900">Create an account</h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Or
                <a href="{% url 'two_factor:login' %}" class="font-medium text-indigo-600 hover:text-indigo-500">Sign in</a>
            </p>
        </div>

        <form class="mt-8 space-y-6 django-form" action="{% url 'signup' %}" method="POST">
            {% csrf_token %}
            
            <div class="space-y-4">
                {% for field in form %}
                    <div>
                        {{ field.label_tag }}
                        {{ field }}
                        {% if field.help_text %}
                            <span class="helptext">{{ field.help_text }}</span>
                        {% endif %}
                        {{ field.errors }}
                    </div>
                {% endfor %}
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 mt-6">
                    Create Account
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

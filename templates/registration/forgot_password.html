{% extends 'base.html' %}

{% block content %}
<div class="flex-grow flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg border border-gray-100">
        <div>
            <h2 class="mt-2 text-center text-3xl font-extrabold text-gray-900">Forgot Password?</h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Enter your email address and we'll send you a password reset link.
            </p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="p-4 rounded-xl shadow-sm text-sm {% if message.tags == 'error' %}bg-red-50 text-red-700 border-l-4 border-red-500{% else %}bg-green-50 text-green-700 border-l-4 border-green-500{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form class="mt-8 space-y-6" action="{% url 'forgot_password' %}" method="POST">
            {% csrf_token %}
            
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" name="email" required autocomplete="email" 
                       class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                       placeholder="your@email.com">
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 mt-6">
                    Send Reset Link
                </button>
            </div>

            <div class="text-center">
                <p class="text-sm text-gray-600">
                    Remember your password?
                    <a href="{% url 'two_factor:login' %}" class="font-medium text-indigo-600 hover:text-indigo-500">Sign in</a>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
